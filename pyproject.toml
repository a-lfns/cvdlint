[project]
name = "cvdlint"
version = "0.1.0"
description = "Lint Python visualisation palettes for colour-vision-deficiency accessibility"
readme = "README.md"
authors = [
    { name = "Alice Alfonsi", email = "alice.alfonsi@knmi.nl" }
]
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["accessibility", "colourblindness", "linting", "visualisation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=2.0",
]

[project.urls]
Homepage = "https://github.com/a-lfns/cvdlint.git"
Repository = "https://github.com/a-lfns/cvdlint.git"
Issues = "https://github.com/a-lfns/cvdlint.git/issues"

[project.optional-dependencies]
matplotlib = ["matplotlib>=3.8"]
plotly = ["plotly>=5"]
root = []
docs = [
    "furo>=2024.8.6",
    "sphinx>=8.1",
    "sphinx-copybutton>=0.5.2",
]

[project.scripts]
cvdlint = "cvdlint.cli:main"

[dependency-groups]
dev = [
    "matplotlib>=3.8",
    "plotly>=5",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.9",
]

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
