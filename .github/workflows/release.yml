name: Publish release to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: false
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(uv version --short)" = "${GITHUB_REF_NAME}"
      - name: Build wheel and source distribution
        run: uv build --no-sources
      - name: Smoke-test wheel
        run: uv run --isolated --no-project --with ./dist/*.whl tests/smoke_test.py
      - name: Smoke-test source distribution
        run: uv run --isolated --no-project --with ./dist/*.tar.gz tests/smoke_test.py
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/

  publish-pypi:
    name: Publish distributions to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cvdlint
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2

  verify-pypi:
    name: Verify package from PyPI
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - name: Install and test the published package
        run: |
          version="${GITHUB_REF_NAME#v}"
          for attempt in {1..6}; do
            if uv run \
              --isolated \
              --no-project \
              --refresh-package cvdlint \
              --with "cvdlint==$version" \
              tests/smoke_test.py; then
              exit 0
            fi
            if [[ "$attempt" -eq 6 ]]; then
              exit 1
            fi
            sleep 10
          done

  create-github-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" =~ (a|b|rc)[0-9]+$ ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            "${prerelease[@]}"
